<!doctype html>
<html>
  {% include head.html %}
  
  <style>
    /* 1. Elimina el espacio reservado del header */
    .content-wrapper {
      padding-top: 10px !important; 
    }
    /* 2. Sube el título de la página */
    .page-content h1, .post-title {
      margin-top: 0 !important;
      padding-top: 0 !important;
    }
    /* 3. Ajusta el contenedor de la página */
    .page-content {
      margin-top: 0 !important;
    }
  </style>
  
  <body>
    <div class="container">
      {% include header.html %}
      <div class="content-wrapper">
        {{ content }}
      </div>
      {% include footer.html %}
    </div>
  </body>
</html>
