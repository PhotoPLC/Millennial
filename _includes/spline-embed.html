<style>
  .spline-box {
    width: 100%;
    height: 500px;      /* Altura del recuadro */
    margin: 20px 0;
    border-radius: 12px;
    overflow: hidden;   /* Esto hace que el iframe respete las esquinas redondeadas */
    background: #111;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    position: relative;
  }

  /* Estilos para que el iframe ocupe todo el recuadro */
  .spline-box iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>

<div class="spline-box">
  <iframe 
    src="{{ include.url }}" 
    allow="autoplay; fullscreen; xr-spatial-tracking"
    loading="lazy">
  </iframe>
</div>
