<section class="hero-section" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('{{ include.image | relative_url }}');">
  
  <div class="hero-container"> 
    
    <div class="hero-content">
      <h1>{{ include.title }}</h1>
      <p>{{ include.subtitle }}</p>
      {% if include.button_link %}
        <a href="{{ include.button_link | relative_url }}" class="hero-button">
          {{ include.button_text | default: "Leer más" }}
        </a>
      {% endif %}
    </div>

    <div class="hero-right-side">
      <blockquote class="stravinsky-quote">
        <p>"La música es una arquitectura de sonidos; es el orden del tiempo y del espacio."</p>
        <footer>— Igor Stravinsky</footer>
      </blockquote>
    </div>

  </div> </section>

<style>
  .hero-section {
    height: 80vh;
    width: 100vw;
    position: relative; 
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    background-size: cover;
    background-position: center;
    background-attachment: fixed !important;
    display: flex;
    align-items: center;
    box-sizing: border-box;
    color: white;
    margin-bottom: 2rem;
    overflow: hidden;
  }

  /* Distribución de los dos bloques */
  .hero-container {
    display: flex;
    width: 100%;
    justify-content: space-between; /* Empuja uno a cada lado */
    align-items: center;
    padding: 0 80px;
    box-sizing: border-box;
  }

  .hero-content {
    flex: 1;
    text-align: left;
  }

  .hero-content h1 {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    margin-bottom: 1rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
  }

  .hero-content p {
    font-size: 1.5rem;
    margin-bottom: 2rem;
  }

  .hero-button {
    background: #ff4b2b;
    color: white !important;
    padding: 12px 30px;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    text-transform: uppercase;
    transition: 0.3s ease;
    display: inline-block;
  }

  .hero-button:hover {
    background: #e63e1f;
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(255, 75, 43, 0.5);
  }

  /* Estilos de la cita */
  .hero-right-side {
    flex: 1;
    display: flex;
    justify-content: flex-end;
  }

  .stravinsky-quote {
    text-align: right;
    max-width: 350px;
    border-right: 3px solid #ff4b2b;
    padding-right: 20px;
    margin: 0;
  }

  .stravinsky-quote p {
    font-size: 1.2rem;
    font-style: italic;
    margin-bottom: 8px;
  }

  .stravinsky-quote footer {
    font-size: 0.9rem;
    opacity: 0.8;
  }

  /* --- RESPONSIVE --- */
@media (max-width: 768px) {
  .hero-section {
    background-attachment: scroll !important;
    height: 60vh;
    /* IMPORTANTE: Resetear el padding de 80px que pusimos arriba */
    padding-left: 20px !important; 
    padding-right: 20px !important;
    display: flex;
    justify-content: center; /* Centra el contenido horizontalmente */
    align-items: center;     /* Centra el contenido verticalmente */
  }
    
    .hero-container {
      padding: 0 20px;
      justify-content: center;
    }

    .hero-content {
      text-align: center;
    }

    .hero-content h1 { font-size: 2.2rem; }

    /* OCULTAR CITA SOLO EN MÓVIL */
    .hero-right-side {
      display: none;
    }
  }
.hero-container {
    padding: 0; /* Quitamos paddings extra del contenedor */
    width: 100%;
    justify-content: center;
  }

  .hero-content {
    text-align: center; /* Centra el texto */
    max-width: 100%;
  }

  .hero-content h1 {
    font-size: 2.2rem;
    text-align: center;
  }

  .hero-content p {
    text-align: center;
    margin: 0 auto 1.5rem; /* Centra el párrafo */
  }

  .hero-right-side {
    display: none; /* Mantenemos la cita oculta */
  }
}
  @media (min-width: 1800px) {
    .hero-container { padding-left: 15%; padding-right: 15%; }
  }
</style>
