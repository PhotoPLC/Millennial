<section class="hero-section" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('{{ include.image | relative_url }}');">
  
  <div class="hero-container">
    
    <div class="hero-content">
      <h1>{{ include.title }}</h1>
      <p>{{ include.subtitle }}</p>
      {% if include.button_link %}
        <a href="{{ include.button_link | relative_url }}" class="hero-button">
          {{ include.button_text | default: "Leer más" }}
        </a>
      {% endif %}
    </div>
    
    <div class="hero-right-side">
      <blockquote class="stravinsky-quote">
        <p>"La música es una arquitectura de sonidos; es el orden del tiempo y del espacio."</p>
        <footer>— Igor Stravinsky</footer>
      </blockquote>
    </div>
    
  </div> </section>

<style>
  .hero-section {
    height: 80vh;
    width: 100vw;
    position: relative; 
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    background-size: cover;
    background-position: center;
    background-attachment: fixed !important;
    display: flex;
    align-items: center; /* Centra verticalmente */
    justify-content: center;
    box-sizing: border-box;
    color: white; /* Texto blanco */
    background-color: #333; /* Color de respaldo gris oscuro por si falla la imagen */
    margin-bottom: 2rem;
    overflow: hidden;
  }

  /* Contenedor que organiza izquierda y derecha */
  .hero-container {
    display: flex;
    width: 100%;
    max-width: 1200px;
    justify-content: space-between;
    align-items: center;
    padding: 0 80px;
    box-sizing: border-box;
  }

  .hero-content {
    flex: 1; /* Ocupa espacio disponible */
    text-align: left;
  }

  .hero-content h1 {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    margin-bottom: 1rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    line-height: 1.1;
  }

  .hero-content p {
    font-size: 1.5rem;
    margin-bottom: 2rem;
    max-width: 600px;
  }
