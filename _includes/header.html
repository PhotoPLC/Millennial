<header class="site-header">
  <h3 class="site-title">
    <a href="{{ site.github.url }}/">{{ site.title }}</a>
  </h3>

  <nav class="menu-list">
    {% for item in site.data.settings.menu %}
      <a href="{{ site.github.url }}/{{ item.url }}" 
         class="menu-link {% if page.url contains item.url %}active{% endif %}" 
         data-umami-event="nav-{{ item.name }}">
         {{ item.name }}
      </a>
    {% endfor %}
      
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" class="menu-link" target="_blank" rel="noopener noreferrer" data-umami-event="clic-{{ item.icon }}">
          <i class="fa fa-{{ item.icon }}" aria-hidden="true"></i>
        </a>
      {% endfor %}
    </nav>

    <div class="dropdown">
      <button class="dropbtn" aria-label="Abrir menú">
        <i class="fa fa-bars" aria-hidden="true"></i>
      </button>
      <div class="dropdown-content">
        {% for item in site.data.settings.menu %}
          <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link" data-umami-event="nav-mobile-{{ item.name }}">
            {{ item.name }}
          </a>
        {% endfor %}
        {% for item in site.data.settings.social %}
          <a href="{{ item.link }}" class="menu-link" target="_blank" rel="noopener noreferrer" data-umami-event="clic-mobile-{{ item.icon }}">
            <i class="fa fa-{{ item.icon }}" aria-hidden="true"></i>
          </a>
        {% endfor %}
      </div>
    </div>
</header>
